name: Green-Path CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  candidate-generation-test:
    runs-on: ubuntu-latest

    steps:
    # get the repository source code
      - name: checkout repository
        uses: actions/checkout@v4
    
    # prepare node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22
    
    # install backend dependencies
      - name: Install backend dependencies
        working-directory: ./greenpath-server
        run: npm ci

    # Execute candidate generation test
      - name: Test candidate generation
        working-directory: ./greenpath-server
        run: npm test